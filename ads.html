<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clephu Ad Network - Monetization Frame</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #060913; color: #fff; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .ad-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-top: 1px solid rgba(99, 102, 241, 0.3); padding: 0 16px; box-sizing: border-box; }
        .ad-left { display: flex; align-items: center; gap: 10px; }
        .ad-badge { background: #f59e0b; color: #000; font-size: 8px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .ad-text { font-size: 11px; font-weight: 600; color: #f8fafc; }
        .ad-right { display: flex; align-items: center; gap: 8px; }
        .ad-btn { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: 700; cursor: pointer; text-decoration: none; box-shadow: 0 2px 10px rgba(99,102,241,0.4); }
        .ad-close { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); padding: 5px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>

    <div class="ad-container" id="adBoxMain">
        <div class="ad-left">
            <span class="ad-badge">Ad</span>
            <div id="adDynamicContent" class="ad-text">Loading Clephu Global Ad Network...</div>
        </div>
        <div class="ad-right">
            <a href="#" id="adActionBtn" class="ad-btn" target="_blank" style="display: none;">Install</a>
            <button class="ad-close" onclick="closeAdFrame()">✕</button>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            // Cek apakah saklar iklan di admin aktif atau mati
            const adStatus = localStorage.getItem('clephu_ad_switch') !== 'off';
            const adBox = document.getElementById('adBoxMain');
            const content = document.getElementById('adDynamicContent');
            const actionBtn = document.getElementById('adActionBtn');

            if (!adStatus) {
                adBox.style.display = 'none'; // Sembunyikan jika dimatikan admin
                return;
            }

            // Ambil skrip/kode iklan yang disimpan admin
            const savedAdScript = localStorage.getItem('clephu_google_ads');

            if (savedAdScript && savedAdScript.trim() !== "") {
                // Jika admin memasukkan script/kode custom
                content.innerHTML = savedAdScript;
            } else {
                // Tampilan default profesional jika belum diisi script oleh admin
                content.innerHTML = "<b>Clephu Sponsor:</b> Play & Build HTML5 Games Globally!";
                actionBtn.style.display = 'inline-block';
                actionBtn.href = "index.html";
                actionBtn.innerText = "Explore";
            }
        });

        function closeAdFrame() {
            // Menyembunyikan frame iklan jika tombol close diklik oleh pemain
            const adBox = document.getElementById('adBoxMain');
            if (adBox) adBox.style.display = 'none';
        }
    </script>
</body>
</html>
